# QAG-RAG 实验配置 - OpenAI QAG 检索
name: "openai_poke_retrieval"
description: "deepseek-v3.2 模型在 BioASQ 数据集上的 PoKE 检索实验配置"

dataset:
  name: "bioasq"
  test_file: "/mnt/e/Acdamic/Papers/rag-mini-bioasq/data/rag_mini_bioasq_qa"
  corpus_file: "/mnt/e/Acdamic/Papers/rag-mini-bioasq/data/rag_mini_bioasq_corpus"
  sample_size: 10

llm:
  provider: "openai"
  model: "Pro/deepseek-ai/DeepSeek-V3.2"
  api_key: "sk-cbpmyndplejzqmzzwfhmtlkwhamhmrijkxogijtgabjzijyf"
  base_url: "https://api.siliconflow.cn/v1"

embedding:
  provider: "openai"
  model: "Pro/BAAI/bge-m3"
  api_key: "sk-cbpmyndplejzqmzzwfhmtlkwhamhmrijkxogijtgabjzijyf"
  base_url: "https://api.siliconflow.cn/v1"
  dimension: 1024

vector_db:
  milvus_uri: "http://localhost:19530"
  milvus_token: "root:Milvus"
  milvus_db_name: "rag_mini_bioasq"
  query_collection: "mini_bioasq_query_deepseekv3_2"
  chunk_collection: "native_rag"

graph_db:
  neo4j_uri: "bolt://localhost:17687"
  neo4j_username: "neo4j"
  neo4j_password: "neo4j123"

# 知识库构建额外配置（用于 build_knowledge_base.py）
extra:
  temperature: 0.7
  max_tokens: 2048
  
  # 多线程配置
  worker_count: 4              # 并行 worker 数量，默认 4
  batch_save_interval: 10      # 每处理 N 个 passage 保存一次状态，默认 10
  
  # 检索参数（可选）
  merge_threshold: 0.9         # 查询合并阈值（余弦相似度）
  related_threshold: 0.7       # 查询关联阈值（余弦相似度）
  limite_num_q: 6              # 每个查询的最大相关问题数
  limite_related_docs: 30      # 每个查询的最大相关文档数
